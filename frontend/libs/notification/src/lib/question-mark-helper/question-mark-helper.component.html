@if (message()) {
	<sup
		class="badge badge-primary badge-xs cursor-help border-none px-1 font-bold leading-none align-middle opacity-70"
		[style.backgroundColor]="backgroundColor() || null"
		>?</sup
	>
} @else {
	<sup class="badge badge-warning badge-xs cursor-help border-none px-1 font-bold leading-none align-middle opacity-70">!</sup>
}
