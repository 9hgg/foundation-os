<div class="bg-base-100 flex h-full w-full max-w-5xl flex-col  p-3 justify-between">
	<!-- Header -->

	<h3
		class="border-base-200 h-16 border-b px-6 py-4 text-lg font-bold"
		[translate]
	>
		File selection
	</h3>

	<!-- Body -->

	<lib-file-table
		click-behavior="select"
		class="block h-[calc(90vh-170px)] w-full"
		#fileTable
	></lib-file-table>

	<!-- Footer Actions -->
	<div class="modal-action border-base-200 bg-base-100 m-0 h-16 border-t px-6 py-4">
		<button
			class="btn"
			(click)="cancel()"
			[translate]
		>
			Cancel
		</button>

		<button
			class="btn btn-primary"
			[disabled]="!fileTable.itemsSelector.valid"
			(click)="save()"
			[translate]
		>
			Select
		</button>
	</div>
</div>
