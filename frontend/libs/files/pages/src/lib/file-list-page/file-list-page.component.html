<div class="bg-base-200/30 flex h-full w-full flex-col overflow-auto">
	<!-- Page Header -->
	<header class="bg-base-100 border-base-200 flex items-center justify-between border-b px-8 py-6">
		<div>
			<h1 class="text-base-content text-3xl font-bold">
				<span [translate]>Your folders</span>
			</h1>
			<p class="text-base-content/50 mt-1 text-sm font-medium">Organize and manage your media files</p>
		</div>

		<div class="flex gap-3">
			<button
				class="btn btn-outline btn-primary"
				(click)="uploadButton.simulateClick(true)"
			>
				<tw-upload class="h-5 w-5"></tw-upload>
				<span [translate]>Upload a file</span>
			</button>
			<button
				class="btn btn-primary shadow-primary/20 shadow-lg"
				(click)="createNewFolder()"
			>
				<svg
					xmlns="http://www.w3.org/2000/svg"
					fill="none"
					viewBox="0 0 24 24"
					stroke-width="2"
					stroke="currentColor"
					class="h-5 w-5"
				>
					<path
						stroke-linecap="round"
						stroke-linejoin="round"
						d="M12 4.5v15m7.5-7.5h-15"
					/>
				</svg>
				<span [translate]>New folder</span>
			</button>
		</div>
	</header>

	<!-- Content -->
	<main class="flex-1 p-8">
		<div class="h-16">
			<lib-folder-path [(folderId)]="folderId" />
		</div>

		<!-- FOLDER TABLE always on top -->
		<lib-folder-table
			class="mb-6 shrink-0"
			[(folderId)]="folderId"
			click-behavior="customFn"
		/>

		<lib-upload-button
			class="w-full"
			(uploadedFiles)="processUploadedFiles($event)"
			[width]="'100%'"
			[height]="'unset'"
			[openOnClick]="false"
			#uploadButton
		>
			<lib-file-table
				class="h-96"
				#fileTable
				[(folderId)]="folderId"
				click-behavior="expand"
				[(searchPatternInUrl)]="fileSearchPattern"
			/>
		</lib-upload-button>
	</main>
</div>
