<div class="bg-base-200/30 flex h-full w-full flex-col overflow-auto">
	<!-- Page Header -->
	<header class="bg-base-100 border-base-200 flex items-center justify-between border-b px-8 py-6">
		<div>
			<h1 class="text-base-content text-3xl font-bold">
				<span [translate]>Your teams</span>
			</h1>
			<p class="text-base-content/50 mt-1 text-sm font-medium" [translate]>Collaborate with your team members</p>
		</div>

		<button
			class="btn btn-primary shadow-primary/20 shadow-lg"
			(click)="createNewTeam()"
		>
			<svg
				xmlns="http://www.w3.org/2000/svg"
				fill="none"
				viewBox="0 0 24 24"
				stroke-width="2"
				stroke="currentColor"
				class="h-5 w-5"
			>
				<path
					stroke-linecap="round"
					stroke-linejoin="round"
					d="M12 4.5v15m7.5-7.5h-15"
				/>
			</svg>
			<span [translate]>New team</span>
		</button>
	</header>

	<!-- Table Content -->
	<main class="flex-1 p-8">
		<lib-team-table
			click-behavior="emit"
			(rowClicked)="goToTeam($event.id)"
			[queryForSearchPatternInUrl]="'teams'"
		></lib-team-table>
	</main>
</div>
