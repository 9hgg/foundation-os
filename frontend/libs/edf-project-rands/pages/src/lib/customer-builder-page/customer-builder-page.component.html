@let customer = customer$$$.$ | async; @if (customer) {
<div class="bg-base-200/50 flex h-full min-h-96 w-full flex-col">
  <nav class="bg-base-100 border-base-200 m-2 flex shrink-0 items-center justify-between overflow-x-auto rounded-xl border px-6 py-3 shadow-sm">
    <a class="text-base-content hover:text-primary flex cursor-pointer items-center justify-center transition-colors sm:justify-start" [routerLink]="'/host/dashboard/customers'">
      <div class="flex cursor-pointer items-center gap-3">
        <div class="from-primary to-secondary flex h-9 w-9 items-center justify-center rounded-lg bg-linear-to-br">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-5 w-5 fill-white"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/></svg>
        </div>
        <span class="text-lg font-semibold" [translate]>Customer Editor</span>
      </div>
    </a>
  </nav>

  <div class="relative m-2 flex h-full min-h-96 flex-1 gap-4 overflow-auto">
    <aside class="bg-base-100 border-base-200 relative w-80 shrink-0 space-y-4 overflow-auto rounded-xl border p-4 shadow-sm">
      <div class="w-full">
        <label for="customer-firstName" class="label px-0 pt-0"><span class="label-text font-medium" [translate]>First name</span></label>
        <input id="customer-firstName" type="text" class="input input-bordered input-sm w-full" [value]="customer.firstName" (change)="updateNames($any($event.target).value, customer.lastName || '')" (keyup)="updateNames($any($event.target).value, customer.lastName || '')" placeholder="First name..." />
      </div>
      <div class="w-full">
        <label for="customer-lastName" class="label px-0 pt-0"><span class="label-text font-medium" [translate]>Last name</span></label>
        <input id="customer-lastName" type="text" class="input input-bordered input-sm w-full" [value]="customer.lastName" (change)="updateNames(customer.firstName || '', $any($event.target).value)" (keyup)="updateNames(customer.firstName || '', $any($event.target).value)" placeholder="Last name..." />
      </div>
      <div class="w-full">
        <label for="customer-identifier" class="label px-0 pt-0"><span class="label-text font-medium" [translate]>Identifier</span></label>
        <input id="customer-identifier" type="text" class="input input-bordered input-sm w-full" [value]="customer.identifier" (change)="updateIdentifier($any($event.target).value)" (keyup)="updateIdentifier($any($event.target).value)" placeholder="Identifier..." />
      </div>

      <div class="w-full">
        <label for="customer-unit" class="label px-0 pt-0"><span class="label-text font-medium" [translate]>Unit</span></label>
        <input id="customer-unit" type="text" class="input input-bordered input-sm w-full" [value]="customer.unit" (change)="updateUnit($any($event.target).value)" (keyup)="updateUnit($any($event.target).value)" placeholder="Unit..." />
      </div>

      <div>
        <h3 class="text-base-content mb-2 text-sm font-medium" [translate]>Quick Actions</h3>
        <div class="grid grid-cols-2 gap-2">
          <button class="btn btn-sm btn-outline btn-secondary">+ stuff</button>
        </div>
      </div>
    </aside>

    <main class="flex-1 overflow-y-auto scroll-smooth">
      <div class="mx-auto max-w-5xl space-y-6">
        <div class="bg-base-100 border-base-200 rounded-xl border shadow-sm">
          <div class="p-6">
            <div class="mb-4 flex items-center justify-between">
              <h2 class="text-base-content text-lg font-semibold" [translate]>Details</h2>
            </div>
            <pre class="bg-base-200/40 max-h-96 overflow-auto rounded-lg p-4 text-sm whitespace-pre-wrap wrap-break-word">{{ customer | json }}</pre>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
} @else {
<div class="bg-base-200/50 flex h-full items-center justify-center">
  <div class="text-center">
    <div class="mb-4 text-6xl">🏷️</div>
    <h1 class="text-base-content text-2xl font-bold" [translate]>Customer Not Found</h1>
    <p class="text-base-content/60 py-6" [translate]>The requested customer is not available</p>
  </div>
</div>
}
