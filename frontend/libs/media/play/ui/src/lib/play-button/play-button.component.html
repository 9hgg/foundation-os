@if (!beingPlayed()) {
	<button
		(click)="playFile()"
		class="relative flex h-full w-full transform items-center justify-center overflow-hidden rounded-full transition-all duration-200 hover:scale-105 active:scale-95"
		[style.background]="'linear-gradient(135deg, ' + (backgroundColor() || '#f43f5e') + ' 0%, ' + adjustBrightness(backgroundColor() || '#f43f5e', -20) + ' 100%)'"
		[style.color]="textColor() || '#ffffff'"
	>
		<tw-play class="relative z-10 h-3/5 w-3/5 drop-shadow-sm" />
	</button>
} @else {
	<button
		(click)="pauseFile()"
		class="relative flex h-full w-full transform items-center justify-center overflow-hidden rounded-full transition-all duration-200 hover:scale-105 active:scale-95"
		[style.background]="'linear-gradient(135deg, ' + (backgroundColor() || '#f43f5e') + ' 0%, ' + adjustBrightness(backgroundColor() || '#f43f5e', -20) + ' 100%)'"
		[style.color]="textColor() || '#ffffff'"
	>
		<tw-pause class="relative z-10 h-3/5 w-3/5 drop-shadow-sm" />
	</button>
}
