<div class="star-rating-container">
	<div class="rating-label">
		<span
			class="label-text"
			[contentEditable]="canvasManager?.editorMode === 'edit'"
			(input)="onLabelChange($event)"
			>{{ label() }}</span
		>
	</div>

	<div class="stars-container">
		@for (star of getStarArray(); track star) {
			<button
				type="button"
				class="star-button"
				[class.filled]="isStarFilled(star)"
				[class.hover]="hoverRating() >= star"
				[disabled]="canvasManager?.editorMode === 'edit'"
				(click)="onStarClick(star)"
				(mouseenter)="onStarHover(star)"
				(mouseleave)="onStarLeave()"
				[attr.aria-label]="'Rate ' + star + ' star' + (star > 1 ? 's' : '')"
			>
				<svg
					class="star-icon"
					viewBox="0 0 24 24"
					fill="currentColor"
				>
					<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
				</svg>
			</button>
		}
	</div>

	@if (rating() > 0) {
		<div class="rating-display">
			<span class="rating-text">{{ getRatingText() }}</span>
		</div>
	}
</div>

@if (canvasManager?.editorMode === 'edit') {
	<!-- prevent interaction when in edit mode -->
	<div class="edit-overlay"></div>

	<!-- Toolbar -->
	<ng-template #toolbarPortalTpl>
		<div
			#toolbar
			class="items-left flex h-full w-full flex-wrap content-start overflow-auto"
		>
			<!-- Label Input -->
			<div class="mb-1 mr-2 flex items-center space-x-2">
				<label
					for="starRatingLabelInput"
					class="text-xs font-medium text-gray-700"
				>
					Label
				</label>
				<input
					id="starRatingLabelInput"
					type="text"
					class="w-32 rounded border border-gray-300 px-2 py-1 text-xs focus:border-transparent focus:ring-2 focus:ring-blue-500"
					[(ngModel)]="label"
					placeholder="Rate your experience"
				/>
			</div>

			<!-- Max Stars Input -->
			<div class="mb-1 mr-2 flex items-center space-x-2">
				<label
					for="maxStarsInput"
					class="text-xs font-medium text-gray-700"
				>
					Max Stars
				</label>
				<input
					id="maxStarsInput"
					type="number"
					class="w-16 rounded border border-gray-300 px-2 py-1 text-xs focus:border-transparent focus:ring-2 focus:ring-blue-500"
					[(ngModel)]="maxStars"
					min="1"
					max="10"
					placeholder="5"
				/>
			</div>
		</div>
	</ng-template>
}
