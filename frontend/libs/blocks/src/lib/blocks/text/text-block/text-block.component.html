<!-- eslint-disable @angular-eslint/template/elements-content -->
@if (blockIsSelected()) {
	<div
		class="h-calc[100%-40px] text-block-editor w-full"
		#quillContainer
	></div>
	<!-- <button
  (click)="openFontDialog()"
  class="absolute bottom-0 right-0 h-8 w-32 bg-pink-400"
  >
  font dialog
</button> -->
} @else {
	<div
		class="ql-container ql-editor"
		[innerHTML]="semanticHTML() | sanitizeHtml"
		contenteditable="false"
	></div>
	<!-- avoid click when edit mode  -->
	@if (canvasManager?.editorMode === 'edit') {
		<div class="absolute left-0 top-0 h-full w-full"></div>
	}
}

<ng-template #toolbarPortalTpl>
	<div
		class="h-full w-full overflow-visible"
		[attr.data-toolbar-id]="'toolbar-' + blockId"
		#toolbar
	>
		<span class="ql-formats">
			<select class="ql-font"></select>
			<select class="ql-size"></select>
		</span>
		<span class="ql-formats">
			<button class="ql-bold"></button>
			<button class="ql-italic"></button>
			<button class="ql-underline"></button>
			<button class="ql-strike"></button>
		</span>
		<span class="ql-formats">
			<select class="ql-color"></select>
			<select class="ql-background"></select>
		</span>
		<span class="ql-formats">
			<button
				class="ql-script"
				value="sub"
			></button>
			<button
				class="ql-script"
				value="super"
			></button>
		</span>
		<span class="ql-formats">
			<button
				class="ql-header"
				value="1"
			></button>
			<button
				class="ql-header"
				value="2"
			></button>
			<button class="ql-blockquote"></button>
			<button class="ql-code-block"></button>
		</span>
		<span class="ql-formats">
			<button
				class="ql-list"
				value="ordered"
			></button>
			<button
				class="ql-list"
				value="bullet"
			></button>
			<button
				class="ql-indent"
				value="-1"
			></button>
			<button
				class="ql-indent"
				value="+1"
			></button>
		</span>
		<span class="ql-formats">
			<button
				class="ql-direction"
				value="rtl"
			></button>
			<select class="ql-align"></select>
		</span>
		<span class="ql-formats">
			<button class="ql-link"></button>
			<button class="ql-image"></button>
			<button class="ql-video"></button>
			<button class="ql-formula hidden"></button>
		</span>
		<span class="ql-formats">
			<button class="ql-clean"></button>
		</span>
	</div>
</ng-template>
