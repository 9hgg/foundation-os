<lib-play-button
	[backgroundColor]="backgroundColor()"
	[textColor]="textColor()"
	[borderColor]="borderColor()"
	[buttonHeight]="'100%'"
	[buttonWidth]="'100%'"
	[medialUrl]="audioUrl()"
	[entityFileId]="audioSourceEntityFile()?.id??null"
	[title]="audioTitle()"
></lib-play-button>

@if (canvasManager?.editorMode === 'edit') {
	<div
		name="audio-overlay"
		class="absolute left-0 top-0 flex h-full w-full opacity-0 hover:opacity-100"
		role="button"
		tabindex="0"
	>
		<lib-upload-button
			class="absolute left-0 top-0"
			(uploadedFiles)="processUploadedFiles($event)"
			[width]="'100%'"
			[height]="'100%'"
			[openOnClick]="false"
			[accept]="'audio/*'"
			#uploadButton
			><span></span>
		</lib-upload-button>
	</div>

	<ng-template #toolbarPortalTpl>
		<div class="items-left flex h-full w-full flex-wrap content-start overflow-auto">
			<!-- source kind selection -->
			<div class="mb-1 mr-2 flex items-center space-x-2">
				<label
					for="audioObjectFitInput"
					class="text-xs font-medium text-gray-700"
				>
					Audio source:
				</label>
				<button
					class="flex rounded border border-gray-300 bg-white px-2 py-1 text-xs text-gray-700 transition-colors hover:bg-gray-50 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1"
					[cdkMenuTriggerFor]="audioSourceKindMenu"
				>
					@switch (audioSourceKind()) {
						@case ('url') {
							<span>url</span>
						}
						@case ('entityFile') {
							<span>uploaded audio</span>
						}
						@case ('placeholder') {
							<span>placeholder</span>
						}
					}
					<svg
						xmlns="http://www.w3.org/2000/svg"
						fill="none"
						viewBox="0 0 24 24"
						stroke="currentColor"
						class="h-4 w-4"
					>
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M19 9l-7 7-7-7"
						/>
					</svg>
				</button>
				<ng-template #audioSourceKindMenu>
					<div
						class="sp-menu"
						cdkMenu
					>
						<button
							class="sp-menu-item"
							cdkMenuItem
							value="fill"
							(click)="audioSourceKind.set('url')"
						>
							url
						</button>
						<button
							class="sp-menu-item"
							cdkMenuItem
							value="contain"
							(click)="audioSourceKind.set('entityFile')"
						>
							uploaded audio
						</button>
						<button
							class="sp-menu-item"
							cdkMenuItem
							value="none"
							(click)="audioSourceKind.set('placeholder')"
						>
							placeholder
						</button>
					</div>
				</ng-template>
			</div>

			<!-- source definition -->
			@switch (audioSourceKind()) {
				@case ('url') {
					<div class="mb-1 mr-2 flex items-center space-x-2">
						<label
							for="audioSourceUrlInput"
							class="text-xs font-medium text-gray-700"
						>
							URL:
						</label>
						<input
							id="audioSourceUrlInput"
							type="text"
							class="w-32 rounded border border-gray-300 px-2 py-1 text-xs focus:border-transparent focus:ring-2 focus:ring-blue-500"
							[(ngModel)]="audioSourceUrl"
							placeholder="https://"
						/>
					</div>
				}
				@case ('entityFile') {
					<div class="mb-1 mr-2 flex items-center space-x-2">
						<label
							for="audioSourceEntityFileExistingInput"
							class="text-xs font-medium text-gray-700"
						>
							Select:
						</label>
						<button
							class="rounded border border-blue-500 bg-blue-500 px-2 py-1 text-xs text-white transition-colors hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1"
							(click)="useAnExistingFile()"
							id="audioSourceEntityFileExistingInput"
						>
							<svg
								xmlns="http://www.w3.org/2000/svg"
								width="16"
								height="16"
								fill="currentColor"
								viewBox="0 0 16 16"
								class="h-4 w-4"
							>
								<path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h2.764c.958 0 1.76.56 2.311 1.184C7.985 3.648 8.48 4 9 4h4.5A1.5 1.5 0 0 1 15 5.5v7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 12.5zM2.5 3a.5.5 0 0 0-.5.5V6h12v-.5a.5.5 0 0 0-.5-.5H9c-.964 0-1.71-.629-2.174-1.154C6.374 3.334 5.82 3 5.264 3zM14 7H2v5.5a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5z" />
							</svg>
						</button>
					</div>

					<div class="mb-1 mr-2 flex items-center space-x-2">
						<label
							for="audioSourceEntityFileUploadInput"
							class="text-xs font-medium text-gray-700"
						>
							Upload:
						</label>
						<button
							class="rounded border border-gray-300 bg-white px-2 py-1 text-xs text-gray-700 transition-colors hover:bg-gray-50 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1"
							(click)="uploadButton.simulateClick(true)"
							id="audioSourceEntityFileUploadInput"
						>
							<tw-upload class="h-4 w-4"></tw-upload>
						</button>
					</div>
				}
				@case ('placeholder') {
					<!-- nothing to do -->
				}
				@default {
					<!-- nothing to do -->
				}
			}

			<!-- play-button background color -->
			<div class="mb-1 mr-2 flex items-center space-x-2">
				<label
					for="playButtonBackgroundColorInput"
					class="text-xs font-medium text-gray-700"
					[translate]
				>
					Button BG:
				</label>
				<input
					id="playButtonBackgroundColorInput"
					type="color"
					class="h-6 w-12 rounded border border-gray-300 px-1 py-1 focus:border-transparent focus:ring-2 focus:ring-blue-500"
					[value]="backgroundColor()"
					(change)="backgroundColor.set(backgroundColorPicker.value)"
					#backgroundColorPicker
				/>
			</div>

			<!-- play-button text color -->
			<div class="mb-1 mr-2 flex items-center space-x-2">
				<label
					for="playButtonTextColorInput"
					class="text-xs font-medium text-gray-700"
					[translate]
				>
					Text Color:
				</label>
				<input
					id="playButtonTextColorInput"
					type="color"
					class="h-6 w-12 rounded border border-gray-300 px-1 py-1 focus:border-transparent focus:ring-2 focus:ring-blue-500"
					[value]="textColor()"
					(change)="textColor.set(textColorPicker.value)"
					#textColorPicker
				/>
			</div>

			<!-- title -->
			<div class="mb-1 mr-2 flex items-center space-x-2">
				<label
					for="audioTitleInput"
					class="text-xs font-medium text-gray-700"
				>
					Title:
				</label>
				<input
					id="audioTitleInput"
					type="text"
					class="w-32 rounded border border-gray-300 px-2 py-1 text-xs focus:border-transparent focus:ring-2 focus:ring-blue-500"
					[(ngModel)]="audioTitle"
					placeholder="question:"
				/>
			</div>

			<!-- Width -->
			<div class="mb-1 mr-2 flex items-center space-x-2">
				<label
					for="blockWidthInput"
					class="text-xs font-medium text-gray-700"
				>
					W:
				</label>
				<input
					id="blockWidthInput"
					type="number"
					class="w-16 rounded border border-gray-300 px-2 py-1 text-xs focus:border-transparent focus:ring-2 focus:ring-blue-500"
					[(ngModel)]="width"
					placeholder="px"
				/>
			</div>

			<!-- Height -->
			<div class="mb-1 mr-2 flex items-center space-x-2">
				<label
					for="blockHeightInput"
					class="text-xs font-medium text-gray-700"
				>
					H:
				</label>
				<input
					id="blockHeightInput"
					type="number"
					class="w-16 rounded border border-gray-300 px-2 py-1 text-xs focus:border-transparent focus:ring-2 focus:ring-blue-500"
					[(ngModel)]="height"
					placeholder="px"
				/>
			</div>
		</div>
	</ng-template>
}
