@let article = article$$$.$ | async;

@if (article) {
	<div class="bg-base-200/50 flex h-full min-h-96 w-full flex-col overflow-auto">
		<!-- Top Bar -->
		<nav class="border-base-300 bg-base-100 m-2 flex shrink-0 items-center justify-between gap-4 overflow-x-auto rounded-xl border px-6 py-3 shadow-sm">
			<a
				class="text-base-content hover:text-primary flex cursor-pointer items-center gap-3 transition-colors"
				[routerLink]="'/host/dashboard/articles'"
			>
				<div class="flex h-9 w-9 items-center justify-center rounded-lg bg-linear-to-br from-violet-500 to-fuchsia-500">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						viewBox="0 200 2048 2048"
						class="h-5 w-5 fill-white"
					>
						<path d="M1024 165l941 942-90 90-83-82v805h-640v-640H896v640H256v-805l-83 82-90-90zm640 1627V987l-640-640-640 640v805h384v-640h512v640h384z" />
					</svg>
				</div>
				<span
					class="text-lg font-semibold"
					[translate]
					>Article editor</span
				>
			</a>

			<div class="flex items-center gap-2">
				<button
					class="btn btn-primary btn-sm"
					(click)="goToArticle(article.id)"
				>
					<span>Preview</span>
				</button>
				<button
					class="btn btn-ghost btn-sm"
					(click)="editing.set(!editing())"
				>
					{{ editing() ? 'View Mode' : 'Edit Mode' }}
				</button>
			</div>
		</nav>

		<!-- Main Layout -->
		<div class="relative m-2 flex h-full min-h-96 flex-1 gap-4 overflow-auto">
			<!-- Left Column: Sidebar -->
			<aside
				class="sp-list border-base-300 bg-base-100 relative hidden max-h-full w-80 shrink-0 space-y-4 overflow-auto rounded-xl border p-4 lg:block"
				cdkDropList
			>
				<!-- Article Title -->
				<div class="border-base-200/50 bg-base-200/50 rounded-xl border p-4">
					<label class="text-base-content/60 mb-2 block text-xs font-semibold tracking-wider uppercase">Title</label>
					<input
						type="text"
						class="input input-bordered w-full"
						[(ngModel)]="articleTitle"
					/>
				</div>

				<!-- Slug -->
				<div class="border-base-200/50 bg-base-200/50 rounded-xl border p-4">
					<label class="text-base-content/60 mb-2 block text-xs font-semibold tracking-wider uppercase">Slug</label>
					<input
						type="text"
						disabled
						class="input input-bordered w-full"
						[value]="article.slug"
					/>
				</div>

				<!-- Tags -->
				<div class="border-base-200/50 bg-base-200/50 rounded-xl border p-4">
					<label class="text-base-content/60 mb-2 block text-xs font-semibold tracking-wider uppercase">Tags</label>
					<div class="mb-3 flex flex-wrap gap-2">
						@for (tag of article.tags; track tag) {
							<span class="badge badge-primary badge-lg gap-1">
								{{ tag }}
								<button
									class="hover:text-primary-content/70"
									(click)="removeTag(tag)"
								>
									×
								</button>
							</span>
						}
					</div>
					<div class="flex gap-2">
						<input
							#tagInput
							type="text"
							class="input input-bordered flex-1"
							placeholder="Add a tag"
							(keyup.enter)="addTag(tagInput.value); tagInput.value = ''"
						/>
						<button
							class="btn btn-sm btn-ghost"
							(click)="addTag(tagInput.value); tagInput.value = ''"
						>
							Add
						</button>
					</div>
				</div>

				<!-- Thumbnail -->
				<div class="border-base-200/50 bg-base-200/50 rounded-xl border p-4">
					<lib-upload-button
						(uploadedFiles)="processUploadedFilesForThumbnail($event)"
						[width]="'100%'"
						[height]="'100%'"
						[accept]="'image/*'"
						#uploadButton
					>
						<label class="text-base-content/60 mb-2 block text-xs font-semibold tracking-wider uppercase">Thumbnail</label>

						@let pictureId = article.config.images?.['thumbnail']?.entityFileId;
						@if (pictureId) {
							<div class="mb-3 overflow-hidden rounded-lg">
								<img
									class="h-32 w-full object-cover"
									[src]="convertToUrl(pictureId)"
									alt="article thumbnail"
								/>
							</div>
							<div class="flex flex-wrap gap-2">
								<button
									(click)="$event.preventDefault()"
									class="btn btn-sm btn-primary"
								>
									<span [translate]>Replace</span>
								</button>
								<button
									(click)="$event.stopImmediatePropagation(); useAnExistingPictureForThumbnail()"
									class="btn btn-sm btn-ghost"
								>
									<span [translate]>Use existing</span>
								</button>
							</div>
						} @else {
							<div class="flex flex-wrap gap-2">
								<button
									(click)="$event.preventDefault()"
									class="btn btn-sm btn-ghost"
								>
									<span [translate]>Upload</span>
								</button>
								<button
									(click)="$event.stopImmediatePropagation(); useAnExistingPictureForThumbnail()"
									class="btn btn-sm btn-primary"
								>
									<span [translate]>Use existing</span>
								</button>
							</div>
						}
					</lib-upload-button>
				</div>

				<!-- Summary -->
				<div class="border-base-200/50 bg-base-200/50 rounded-xl border p-4">
					<label class="text-base-content/60 mb-2 block text-xs font-semibold tracking-wider uppercase">Summary</label>
					<textarea
						class="textarea textarea-bordered h-24 w-full resize-none"
						[(ngModel)]="articleSummary"
						maxlength="200"
						placeholder="Brief description of your article..."
					></textarea>
				</div>

				<!-- Options -->
				<div class="border-base-200/50 bg-base-200/50 rounded-xl border p-4">
					<label class="text-base-content/60 mb-3 block text-xs font-semibold tracking-wider uppercase">Options</label>
					<div class="space-y-3">
						<label class="flex cursor-pointer items-center gap-3">
							<input
								type="checkbox"
								class="checkbox checkbox-sm checkbox-primary"
								[checked]="article.featured"
								(change)="updateFeatured($any($event.target).checked)"
							/>
							<span class="text-base-content text-sm">Featured</span>
							<lib-question-mark-helper [message]="'If enabled, this article will be displayed first in lists.'" />
						</label>

						<label class="flex cursor-pointer items-center gap-3">
							<input
								type="checkbox"
								class="checkbox checkbox-sm checkbox-primary"
								[checked]="anomymousRead()"
								(click)="$event.preventDefault(); togglePublic()"
							/>
							<span class="text-base-content text-sm">Public</span>
							<lib-question-mark-helper [message]="'By default, only you can read the article. If enabled, anyone can read it.'" />
						</label>

						<label class="flex cursor-pointer items-center gap-3">
							<input
								type="checkbox"
								class="checkbox checkbox-sm checkbox-primary"
								[checked]="article.config.commentsEnabled"
								(change)="updateCommentsEnabled($any($event.target).checked)"
							/>
							<span class="text-base-content text-sm">Comments</span>
							<lib-question-mark-helper [message]="'If enabled, users can comment on this article.'" />
						</label>
					</div>
				</div>
			</aside>

			<!-- Right Column: Editor -->
			<main class="flex h-full min-h-96 flex-1 flex-col overflow-auto">
				@if (editing()) {
					<!-- Quill Toolbar - keep white background for visibility -->
					<div
						class="border-base-300 bg-base-100 sticky top-0 z-10 mb-2 shrink-0 overflow-visible rounded-xl border px-4 py-2 shadow-sm"
						[attr.data-toolbar-id]="'toolbar-' + article.id"
						#toolbar
					>
						<span class="ql-formats">
							<select class="ql-font"></select>
							<select class="ql-size"></select>
						</span>
						<span class="ql-formats">
							<button class="ql-bold"></button>
							<button class="ql-italic"></button>
							<button class="ql-underline"></button>
							<button class="ql-strike"></button>
						</span>
						<span class="ql-formats">
							<select class="ql-color"></select>
							<select class="ql-background"></select>
						</span>
						<span class="ql-formats">
							<button
								class="ql-script"
								value="sub"
							></button>
							<button
								class="ql-script"
								value="super"
							></button>
						</span>
						<span class="ql-formats">
							<button
								class="ql-header"
								value="1"
							></button>
							<button
								class="ql-header"
								value="2"
							></button>
							<button class="ql-blockquote"></button>
							<button class="ql-code-block"></button>
						</span>
						<span class="ql-formats">
							<button
								class="ql-list"
								value="ordered"
							></button>
							<button
								class="ql-list"
								value="bullet"
							></button>
							<button
								class="ql-indent"
								value="-1"
							></button>
							<button
								class="ql-indent"
								value="+1"
							></button>
						</span>
						<span class="ql-formats">
							<button
								class="ql-direction"
								value="rtl"
							></button>
							<select class="ql-align"></select>
						</span>
						<span class="ql-formats">
							<button class="ql-link"></button>
							<button class="ql-image"></button>
							<button class="ql-video"></button>
							<button class="ql-formula hidden"></button>
						</span>
						<span class="ql-formats">
							<button class="ql-clean"></button>
						</span>
					</div>

					<!-- Quill Editor Container - keep light background for text editing -->
					<div
						class="text-block-editor border-base-300 bg-base-100 h-full w-full flex-1 shrink overflow-auto rounded-xl border"
						#quillContainer
					></div>
				} @else {
					<!-- Preview Mode -->
					<div class="ql-container ql-snow border-base-300 bg-base-100 h-full w-full shrink-0 overflow-auto rounded-xl border shadow-inner">
						<div
							class="ql-editor"
							[innerHTML]="article.content ?? '' | sanitizeHtml"
							contenteditable="false"
						></div>
					</div>
				}
			</main>
		</div>
	</div>
} @else {
	<div class="flex h-full items-center justify-center">
		<span
			class="text-gray-500 dark:text-gray-400"
			[translate]
			>Article not available</span
		>
	</div>
}
