<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge" />

		<!-- Primary SEO -->
		<title>Leopar — Comme Paréo, mais pas pareil</title>
		<meta
			name="description"
			content="Leopar is a project management workspace for structuring activities, costs, contributors, deliverables, and reports around industrial and R&D projects."
		/>
		<meta
			name="keywords"
			content="project management, portfolio tracking, cost follow-up, contributors, deliverables, industrial projects, R&D projects, reporting"
		/>

		<base href="/" />

		<!-- Canonical -->
		<link rel="canonical" href="https://{{domain_name}}/" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Leopar" />
		<meta property="og:title" content="Leopar — {{short_sentence}}." />
		<meta
			property="og:description"
			content="Manage industrial and R&D projects with structured activities, contributor tracking, deliverables, cost follow-up, and presentation-ready reporting."
		/>
		<meta property="og:url" content="https://Leopar.app/" />
		<meta property="og:image" content="/og-image.png" />
		<meta property="og:image:alt" content="Leopar — project management workspace" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Leopar — Project management workspace" />
		<meta
			name="twitter:description"
			content="Track activities, contributors, costs, deliverables, and reports for industrial and R&D projects in Leopar."
		/>
		<meta name="twitter:image" content="/og-image.png" />

		<!-- App / UI -->
		<meta name="theme-color" content="#ffffff" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />

		<!-- Optional: improve indexing behavior -->
		<meta name="robots" content="index,follow" />
	</head>

	<body>
		<app-root></app-root>
	</body>
</html>
